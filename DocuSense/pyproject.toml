[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "docusense"
version = "0.1.0"
requires-python = ">=3.11"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["frontend/"]

[[tool.mypy.overrides]]
module = "api.main"
# pydantic BaseModel and fastapi/slowapi decorators are Any until packages are installed
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.ruff.lint]
select = ["E", "F", "I"]
line-length = 100
